<!DOCTYPE html>
<html>

<head>

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>PAASWE AR Experience</title>


<!-- ================================================= -->
<!-- A-FRAME -->
<!-- ================================================= -->

<script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>


<!-- ================================================= -->
<!-- MINDAR -->
<!-- ================================================= -->

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


<style>

/* ================================================= */
/* BASIC */
/* ================================================= */

body {

    margin: 0;

    overflow: hidden;

    background: black;

    font-family: Arial, sans-serif;

    touch-action: none;

}


.example-container {

    width: 100%;

    height: 100%;

    position: absolute;

    overflow: hidden;

}


a-scene {

    touch-action: none;

}



/* ================================================= */
/* PROGRESS */
/* ================================================= */

#progress {

    position: fixed;

    top: 20px;

    right: 20px;

    z-index: 9999;

    color: white;

    background: rgba(0,0,0,0.75);

    padding: 10px 17px;

    border-radius: 25px;

    font-size: 20px;

    font-weight: bold;

    pointer-events: none;

}



/* ================================================= */
/* INSTRUCTION */
/* ================================================= */

#instruction {

    position: fixed;

    bottom: 25px;

    left: 50%;

    transform: translateX(-50%);

    z-index: 9999;

    color: white;

    background: rgba(0,0,0,0.75);

    padding: 10px 18px;

    border-radius: 20px;

    font-size: 15px;

    text-align: center;

    pointer-events: none;

    display: none;

    white-space: nowrap;

}



/* ================================================= */
/* 3D MODEL LOADING */
/* ================================================= */

#modelLoading {
    position: fixed;
    left: 50%;
    bottom: 82px;
    transform: translateX(-50%);
    z-index: 9999;
    display: none;
    color: white;
    background: rgba(0,0,0,0.78);
    padding: 10px 18px;
    border-radius: 20px;
    font-size: 14px;
    text-align: center;
    pointer-events: none;
    white-space: nowrap;
}

#modelLoading.error {
    background: rgba(130,0,0,0.82);
}

/* ================================================= */
/* NEXT BUTTON */
/* ================================================= */

#nextButton {

    position: fixed;

    right: 25px;

    bottom: 25px;

    z-index: 9999;

    display: none;

    color: white;

    background: rgba(0,0,0,0.80);

    border: 2px solid white;

    padding: 12px 22px;

    border-radius: 25px;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;

    user-select: none;

    -webkit-user-select: none;

    touch-action: manipulation;
    pointer-events: auto;
    -webkit-tap-highlight-color: transparent;

}


#nextButton:active {

    transform: scale(0.95);

}



/* ================================================= */
/* FRAGMENT CLUE */
/* ================================================= */

#fragmentClue {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: min(72vw, 520px);
    max-height: 62vh;
    object-fit: contain;
    z-index: 9000;
    opacity: 0.45;
    display: none;
    pointer-events: none;
    border-radius: 8px;
}

#clueLabel {
    position: fixed;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 9001;
    color: white;
    background: rgba(0,0,0,0.68);
    padding: 9px 16px;
    border-radius: 20px;
    font-size: 15px;
    font-weight: bold;
    display: none;
    pointer-events: none;
    white-space: nowrap;
}

/* ================================================= */
/* FINAL SCREEN */
/* ================================================= */

#finalScreen {

    position: fixed;

    top: 0;

    left: 0;

    width: 100%;

    height: 100%;

    z-index: 10000;

    background: rgba(70,70,70,0.34);

    display: none;

    flex-direction: column;

    justify-content: flex-start;

    align-items: center;

    text-align: center;

    color: white;
    box-sizing: border-box;
    padding: 32px 20px 28px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;

    pointer-events: none;

}


#finalTitle {

    font-size: 34px;

    font-weight: 700;
    line-height: 1.15;

    margin: 0 0 14px 0;
    text-shadow: 0 2px 6px rgba(0,0,0,0.35);

}


#finalMural {

    width: auto;
    height: min(56vh, 540px);

    max-width: min(78vw, 540px);
    max-height: 56vh;

    object-fit: contain;

    display: block;
    box-shadow: 0 3px 18px rgba(0,0,0,0.18);

}


#finalMessage {

    margin-top: 14px;

    padding: 0 18px;
    width: min(900px, 92vw);

    max-width: 900px;

    font-size: 17px;

    line-height: 1.45;
    text-align: center;
    text-shadow: 0 2px 5px rgba(0,0,0,0.35);
    box-sizing: border-box;

}


/* FINAL SCREEN RESPONSIVE FIT */
@media (max-width: 700px) {
    #finalScreen {
        padding: 24px 14px 24px;
    }

    #finalTitle {
        font-size: 28px;
        margin-bottom: 10px;
    }

    #finalMural {
        height: min(54vh, 480px);
        max-width: 86vw;
    }

    #finalMessage {
        margin-top: 12px;
        padding: 0 8px;
        font-size: 15px;
        line-height: 1.4;
    }
}



/* ================================================= */
/* PUZZLE OVERLAY */
/* ================================================= */
#puzzleOverlay {
    position: fixed;
    inset: 0;
    z-index: 9500;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 8vh 12px 12px;
    box-sizing: border-box;
    background: rgba(0,0,0,0.48);
    pointer-events: auto;
    overflow: visible;
}

#puzzleTitle {
    position: relative;
    z-index: 200;
    color: white;
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 8px;
    text-align: center;
    text-shadow: 0 2px 6px rgba(0,0,0,0.45);
    pointer-events: none;
}

#puzzleHint {
    position: relative;
    z-index: 200;
    color: white;
    font-size: 14px;
    margin: 0 0 12px;
    text-align: center;
    background: rgba(0,0,0,0.62);
    padding: 7px 12px;
    border-radius: 16px;
    pointer-events: none;
}

#puzzleBoard {
    position: relative;
    z-index: 2;
    margin-top: 2px;
    width: min(88vw, 560px);
    aspect-ratio: 3 / 2;
    border: 2px solid rgba(255,255,255,0.9);
    border-radius: 10px;
    overflow: hidden;
    background: rgba(20,20,20,0.75);
    box-shadow: 0 8px 30px rgba(0,0,0,0.35);
    touch-action: none;
    z-index: 2;
}

.puzzle-slot {
    position: absolute;
    box-sizing: border-box;
    border: 1px dashed rgba(255,255,255,0.28);
    background: rgba(255,255,255,0.045);
    pointer-events: none;
}

.puzzle-piece {
    position: absolute;
    box-sizing: border-box;
    cursor: grab;
    border: 1px solid rgba(255,255,255,0.28);
    border-radius: 4px;
    background-repeat: no-repeat;
    background-color: #333;
    box-shadow: 0 6px 18px rgba(0,0,0,0.38);
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    will-change: transform, left, top;
    transition: box-shadow 0.15s ease, opacity 0.2s ease;
    z-index: 20;
    transform-origin: center center;
    animation: puzzlePieceFloat var(--float-duration, 3.2s) ease-in-out infinite;
}

@keyframes puzzlePieceFloat {
    0%, 100% {
        transform: translate3d(0, 0, 0) rotate(var(--piece-rotation, 0deg));
    }
    50% {
        transform: translate3d(0, var(--float-distance, -8px), 0)
                   rotate(var(--piece-rotation, 0deg));
    }
}

.puzzle-piece.dragging {
    cursor: grabbing;
    z-index: 50;
    box-shadow: 0 12px 26px rgba(0,0,0,0.5);
}

.puzzle-piece.locked {
    cursor: default;
    box-shadow: none;
    border-color: rgba(255,255,255,0.55);
}

#puzzleProgress {
    color: white;
    margin-top: 10px;
    font-size: 14px;
    font-weight: 700;
    background: rgba(0,0,0,0.62);
    padding: 7px 12px;
    border-radius: 16px;
}

/* Reload ONLY the current puzzle. It never reloads the AR page or QR flow. */
#puzzleReload {
    position: absolute;
    left: 18px;
    top: 18px;
    z-index: 300;
    width: 44px;
    height: 44px;
    border: 2px solid rgba(255,255,255,0.9);
    border-radius: 50%;
    background: rgba(0,0,0,0.68);
    color: white;
    font-size: 27px;
    line-height: 40px;
    padding: 0;
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    box-shadow: 0 5px 18px rgba(0,0,0,0.35);
}

#puzzleReload:active {
    transform: scale(0.92) rotate(-25deg);
}

@media (max-width: 700px) {
    #puzzleReload {
        left: 12px;
        top: 12px;
        width: 42px;
        height: 42px;
        font-size: 25px;
    }
}

#puzzleComplete {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) scale(0.96);
    z-index: 9600;
    display: none;
    color: white;
    background: rgba(0,0,0,0.82);
    padding: 14px 22px;
    border-radius: 24px;
    font-size: 17px;
    font-weight: 700;
    box-shadow: 0 6px 24px rgba(0,0,0,0.4);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.25s ease, transform 0.25s ease;
}

#puzzleComplete.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
}

@media (max-width: 700px) {
    #puzzleOverlay { padding: 6vh 8px 10px; }
    #puzzleTitle { font-size: 20px; }
    #puzzleHint { font-size: 13px; }
    #puzzleBoard { width: 94vw; }
}

/* ================================================= */
/* FINAL MURAL ASSEMBLY TRANSITION — FINAL ONLY */
/* ================================================= */
#finalAssembly {
    position: fixed;
    inset: 0;
    z-index: 10001;
    display: none;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    opacity: 1;
}

#finalAssemblyFrame {
    position: relative;
    /* Move the completed mural slightly upward so it does not crowd the message.
       This changes position only — NEVER width, height, aspect ratio or image ratio. */
    transform: translateY(-4vh);
    /*
       The six transition images are the real final mural pieces.
       Their natural image ratio is used to calculate the complete
       2-column × 3-row mural ratio in JavaScript, so the pieces are
       NEVER stretched to an arbitrary 2:3 frame.
    */
    width: min(68vw, 720px);
    height: auto;
    max-width: 68vw;
    max-height: 68vh;
    aspect-ratio: 1 / 1;
    overflow: visible;
}

.finalAssemblyPiece {
    position: absolute;
    width: 50%;
    height: 33.333333%;
    object-fit: fill;
    object-position: center center;
    opacity: 0;
    border-radius: 0;
    box-shadow: none;
    display: block;
    margin: 0;
    padding: 0;
    will-change: left, top, transform, opacity;
}

#finalAssemblyTyping {
    position: fixed;
    left: 50%;
    bottom: 9vh;
    transform: translateX(-50%);
    width: min(900px, 92vw);
    padding: 0 18px;
    box-sizing: border-box;
    color: white;
    font-size: 17px;
    line-height: 1.45;
    text-align: center;
    text-shadow: 0 2px 5px rgba(0,0,0,0.35);
    opacity: 0;
}

#finalAssemblyTitle {
    position: fixed;
    top: 42px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    font-size: 34px;
    font-weight: 700;
    line-height: 1.15;
    white-space: nowrap;
    text-shadow: 0 2px 6px rgba(0,0,0,0.35);
    opacity: 0;
}

@media (max-width: 700px) {
    #finalAssemblyFrame {
        transform: translateY(-6vh);
        width: min(86vw, 600px);
        height: auto;
        max-width: 86vw;
        max-height: 58vh;
        aspect-ratio: 1 / 1;
    }

    #finalAssemblyTyping {
        bottom: 9vh;
        padding: 0 8px;
        font-size: 15px;
        line-height: 1.4;
    }

    #finalAssemblyTitle {
        top: 34px;
        font-size: 28px;
        white-space: nowrap;
    }
}

</style>

</head>



<body>


<!-- ================================================= -->
<!-- PROGRESS -->
<!-- ================================================= -->

<div id="progress">

0/6

</div>



<!-- ================================================= -->
<!-- INSTRUCTION -->
<!-- ================================================= -->

<div id="instruction">

Scan a mural fragment to begin

</div>



<!-- ================================================= -->
<!-- FRAGMENT CLUE -->
<!-- ================================================= -->

<div id="clueLabel">
Find this mural fragment
</div>

<img id="fragmentClue" src="" alt="Mural fragment clue">

<!-- ================================================= -->
<!-- INTERACTIVE MURAL PUZZLE -->
<!-- ================================================= -->
<div id="puzzleOverlay">
    <div id="puzzleTitle">Rebuild the mural fragment</div>
    <div id="puzzleHint">Drag each piece into the matching position</div>
    <div id="puzzleBoard"></div>
    <div id="puzzleProgress">0/6 pieces placed</div>

    <button id="puzzleReload" type="button" aria-label="Reload puzzle" title="Shuffle this puzzle again">
        ↻
    </button>
</div>

<div id="puzzleComplete">Fragment complete ✓</div>



<!-- ================================================= -->
<!-- 3D MODEL LOADING -->
<!-- ================================================= -->

<div id="modelLoading">Loading 3D model…</div>

<!-- ================================================= -->
<!-- NEXT BUTTON -->
<!-- ================================================= -->

<div id="nextButton">

NEXT →

</div>



<!-- ================================================= -->
<!-- FINAL SCREEN -->
<!-- ================================================= -->

<div id="finalScreen">

    <div id="finalTitle">

        COMPLETE — 6/6

    </div>


    <img
        id="finalMural"
        src="./mural.final.png"
        alt="Final Mural">


    <div id="finalMessage">

        FINAL MURAL MESSAGE WILL GO HERE

    </div>

</div>



<!-- ================================================= -->
<!-- FINAL MURAL ASSEMBLY TRANSITION — FINAL ONLY -->
<!-- ================================================= -->
<div id="finalAssembly">
    <div id="finalAssemblyFrame">
        <img class="finalAssemblyPiece" data-piece="0" src="./mural.fragment.1.transition.png" alt="">
        <img class="finalAssemblyPiece" data-piece="1" src="./mural.fragment.2.transition.png" alt="">
        <img class="finalAssemblyPiece" data-piece="2" src="./mural.fragment.3.transition.png" alt="">
        <img class="finalAssemblyPiece" data-piece="3" src="./mural.fragment.4.transition.png" alt="">
        <img class="finalAssemblyPiece" data-piece="4" src="./mural.fragment.5.transition.png" alt="">
        <img class="finalAssemblyPiece" data-piece="5" src="./mural.fragment.6.transition.png" alt="">
    </div>
    <div id="finalAssemblyTyping"></div>
    <div id="finalAssemblyTitle">COMPLETE — 6/6</div>
</div>

<!-- ================================================= -->
<!-- AR CONTAINER -->
<!-- ================================================= -->

<div class="example-container">


<a-scene

    id="scene"

    mindar-image="
        imageTargetSrc: ./targets.mind;
        maxTrack: 1;
        filterMinCF: 0.0005;
        filterBeta: 800;
        warmupTolerance: 6;
        missTolerance: 8;
    "

    embedded

    color-space="sRGB"

    renderer="
        colorManagement: true,
        physicallyCorrectLights
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false">


    <!-- ================================================= -->
    <!-- CAMERA -->
    <!-- ================================================= -->

    <!--
        STUDENT WORK 01–06 GLBs

        All six GLBs are loaded by JavaScript, not by A-Frame's
        asset manager. Only the CURRENT fragment's GLB is downloaded
        when that fragment's puzzle starts.

        Keep these files in the SAME folder as index.html:
        student-work-01.glb
        student-work-02.glb
        student-work-03.glb
        student-work-04.glb
        student-work-05.glb
        student-work-06.glb
    -->
    <a-assets timeout="300000"></a-assets>

    <a-camera

        id="camera"

        position="0 0 0"

        look-controls="enabled: false">

    </a-camera>



    <!-- ================================================= -->
    <!-- FRAGMENT 1 -->
    <!-- ================================================= -->

    <a-entity
        id="fragment1"
        mindar-image-target="targetIndex: 0">
    </a-entity>



    <!-- ================================================= -->
    <!-- FRAGMENT 2 -->
    <!-- ================================================= -->

    <a-entity
        id="fragment2"
        mindar-image-target="targetIndex: 1">
    </a-entity>



    <!-- ================================================= -->
    <!-- FRAGMENT 3 -->
    <!-- ================================================= -->

    <a-entity
        id="fragment3"
        mindar-image-target="targetIndex: 2">
    </a-entity>



    <!-- ================================================= -->
    <!-- FRAGMENT 4 -->
    <!-- ================================================= -->

    <a-entity
        id="fragment4"
        mindar-image-target="targetIndex: 3">
    </a-entity>



    <!-- ================================================= -->
    <!-- FRAGMENT 5 -->
    <!-- ================================================= -->

    <a-entity
        id="fragment5"
        mindar-image-target="targetIndex: 4">
    </a-entity>



    <!-- ================================================= -->
    <!-- FRAGMENT 6 -->
    <!-- ================================================= -->

    <a-entity
        id="fragment6"
        mindar-image-target="targetIndex: 5">
    </a-entity>


</a-scene>

</div>



<script>
/* ================================================= */
/* PAASWE AR — PUZZLE FLOW + STUDENT WORK */
/* ================================================= */

const scene = document.querySelector("#scene");
const camera = document.querySelector("#camera");
const progress = document.querySelector("#progress");
const instruction = document.querySelector("#instruction");
const fragmentClue = document.querySelector("#fragmentClue");
const clueLabel = document.querySelector("#clueLabel");
const nextButton = document.querySelector("#nextButton");
const modelLoading = document.querySelector("#modelLoading");
const finalScreen = document.querySelector("#finalScreen");
const finalMural = document.querySelector("#finalMural");
const finalMessage = document.querySelector("#finalMessage");
const puzzleOverlay = document.querySelector("#puzzleOverlay");
const puzzleBoard = document.querySelector("#puzzleBoard");
const puzzleProgress = document.querySelector("#puzzleProgress");
const puzzleReload = document.querySelector("#puzzleReload");
const puzzleComplete = document.querySelector("#puzzleComplete");
const finalAssembly = document.querySelector("#finalAssembly");
const finalAssemblyFrame = document.querySelector("#finalAssemblyFrame");
const finalAssemblyTyping = document.querySelector("#finalAssemblyTyping");
const finalAssemblyTitle = document.querySelector("#finalAssemblyTitle");
const finalAssemblyPieces = Array.from(document.querySelectorAll(".finalAssemblyPiece"));

const TOTAL_FRAGMENTS = 6;
const WORKS_PER_FRAGMENT = 1;
const PUZZLE_COLS = 3;
const PUZZLE_ROWS = 2;
const PUZZLE_PIECES = PUZZLE_COLS * PUZZLE_ROWS;

const fragmentDescriptions = [
    "Rooted in the industrial past, where personal dreams and initial ambitions begin.",
    "Stepping onto the path of action, where the fast-paced world brings the challenge of comparing yourself to others.",
    "Racing upwards through time, where pursuing perfection causes some to grow stronger and some to lose their inner selves.",
    "Pausing at the central clock is the main point where memories are recorded, and pulling back to our original goals.",
    "Facing the modern world and rethinking what success means; keep chasing an impossible ideal of perfection, or choose to be at peace with yourself.",
    "Floating upward into self-acceptance, realizing you are already good enough just as you are."
];

const fragmentClueImages = [
    ["./mural.fragment.1.png", "./mural.fragment1.png"],
    ["./mural.fragment.2.png", "./mural.fragment2.png"],
    ["./mural.fragment.3.png", "./mural.fragment3.png"],
    ["./mural.fragment.4.png", "./mural.fragment4.png"],
    ["./mural.fragment.5.png", "./mural.fragment5.png"],
    ["./mural.fragment.6.png", "./mural.fragment6.png"]
];

/* Glowing clue colors chosen from the visual palette of each mural fragment. */
const fragmentGlowPalettes = [
    ["#D9A441", "#7D5A4F", "#F2C879", "#4B3A72"],
    ["#C98A52", "#6E5B4B", "#E8B66A", "#4F6B78"],
    ["#A96F43", "#4C5660", "#D4A15D", "#5A3E6B"],
    ["#D3A85C", "#6B6258", "#F0C77A", "#3F5E65"],
    ["#B8784E", "#5C5550", "#E3B56C", "#536B7A"],
    ["#C48B55", "#4E4A46", "#E8C47A", "#5A5878"]
];

let clueFallbackIndex = 0;
let activeFragment = null;
let activeWork = null;
let activeWorkIndex = -1;
let completedFragments = 0;
let isDragging = false;
let previousX = 0;
let previousY = 0;

/* GLB state — one lazy-loaded model per mural fragment.
   IMPORTANT: only the current fragment is loaded when its puzzle starts. */
const STUDENT_WORK_URLS = [
    "./student-work-01.glb",
    "./student-work-02.glb",
    "./student-work-03.glb",
    "./student-work-04.glb",
    "./student-work-05.glb",
    "./student-work-06.glb"
];

const STUDENT_WORK_MAX_ATTEMPTS = 3;
const studentWorkStates = Array.from({ length: TOTAL_FRAGMENTS }, function () {
    return {
        ready: false,
        failed: false,
        model: null,
        blobURL: null,
        loadPromise: null
    };
});

/* ================================================= */
/* FRAGMENT DATA */
/* ================================================= */
const fragments = [];
for (let i = 1; i <= TOTAL_FRAGMENTS; i++) {
    fragments.push({
        target: document.querySelector("#fragment" + i),
        index: i - 1,
        hotspots: [],
        works: [],
        caption: null,
        captionPanel: null,
        captionText: null,
        captionTimer: null,
        captionTypingStarted: false,
        captionTypingComplete: false,
        found: false,
        puzzleSolved: false,
        puzzleStarted: false,
        completedWorks: 0
    });
}

/* ================================================= */
/* CLUE */
/* ================================================= */
function showFragmentClue(index) {
    puzzleOverlay.style.display = "none";
    if (index < 0 || index >= TOTAL_FRAGMENTS) {
        hideFragmentClue();
        return;
    }

    const sources = fragmentClueImages[index];
    clueFallbackIndex = 0;

    fragmentClue.onload = function () {
        fragmentClue.style.display = "block";
        clueLabel.innerText = "Find mural fragment " + (index + 1);
        clueLabel.style.display = "block";
    };

    fragmentClue.onerror = function () {
        if (clueFallbackIndex < sources.length - 1) {
            clueFallbackIndex++;
            fragmentClue.src = sources[clueFallbackIndex];
        } else {
            fragmentClue.style.display = "none";
            clueLabel.innerText = "Find mural fragment " + (index + 1);
            clueLabel.style.display = "block";
        }
    };

    fragmentClue.src = sources[0];
}

function hideFragmentClue() {
    fragmentClue.style.display = "none";
    clueLabel.style.display = "none";
}

function isExpectedFragment(fragment) {
    return fragment && fragment.index === completedFragments;
}

/* ================================================= */
/* CAPTION — ORIGINAL TEXT KEPT */
/* ================================================= */
function createFragmentCaption(fragment) {
    const caption = document.createElement("a-entity");
    caption.id = "fragment" + (fragment.index + 1) + "-caption";
    caption.setAttribute("position", "0 -0.62 0.14");
    caption.setAttribute("visible", "false");

    const panel = document.createElement("a-plane");
    panel.setAttribute("position", "0 0 -0.01");
    panel.setAttribute("width", "1.55");
    panel.setAttribute("height", "0.22");
    panel.setAttribute("material", "color: #000000; opacity: 0.68; transparent: true; side: double;");
    caption.appendChild(panel);

    /*
     * Keep the panel hidden until the first character of the caption
     * is ready. This prevents the black box from appearing early.
     */
    panel.setAttribute("visible", "false");

    const text = document.createElement("a-text");
    text.setAttribute("value", "");
    text.setAttribute("align", "center");
    text.setAttribute("anchor", "center");
    text.setAttribute("baseline", "center");
    text.setAttribute("width", "1.45");
    text.setAttribute("color", "#FFFFFF");
    text.setAttribute("wrap-count", "48");
    text.setAttribute("side", "double");
    caption.appendChild(text);

    fragment.target.appendChild(caption);
    fragment.caption = caption;
    fragment.captionPanel = panel;
    fragment.captionText = text;
    fragment.captionTimer = null;
}

function showFragmentCaption(fragment) {
    if (fragment.caption) {
        fragment.caption.setAttribute("visible", "true");
        if (fragment.captionText) {
            fragment.captionText.setAttribute("value", fragmentDescriptions[fragment.index]);
        }
    }
}

function hideFragmentCaption(fragment, resetTyping = true) {
    if (!fragment) return;

    if (fragment.captionTimer) {
        clearTimeout(fragment.captionTimer);
        fragment.captionTimer = null;
    }

    if (fragment.caption) fragment.caption.setAttribute("visible", "false");
    if (fragment.captionPanel) fragment.captionPanel.setAttribute("visible", "false");

    if (resetTyping) {
        fragment.captionTypingStarted = false;
        fragment.captionTypingComplete = false;
        if (fragment.captionText) {
            fragment.captionText.setAttribute("value", "");
        }
    }
}

/*
 * Student Work caption typewriter.
 * IMPORTANT: once typing has started, it is independent of target tracking.
 * Losing the target must NOT pause or restart the sentence.
 */
function typeFragmentCaption(fragment, delayMs) {
    if (!fragment || !fragment.caption || !fragment.captionText) return;

    /* Already finished: simply show the completed sentence. */
    if (fragment.captionTypingComplete) {
        fragment.caption.setAttribute("visible", "true");
        fragment.captionText.setAttribute("value", fragmentDescriptions[fragment.index]);
        return;
    }

    /* Already typing: restore visibility without restarting the timer. */
    if (fragment.captionTypingStarted) {
        fragment.caption.setAttribute("visible", "true");
        return;
    }

    fragment.captionTypingStarted = true;
    fragment.captionTypingComplete = false;

    /*
     * Do not reveal the caption panel yet.
     * It will appear at exactly the same moment as the first character.
     */
    fragment.caption.setAttribute("visible", "false");
    if (fragment.captionPanel) {
        fragment.captionPanel.setAttribute("visible", "false");
    }

    const fullText = fragmentDescriptions[fragment.index];
    let index = 0;
    fragment.captionText.setAttribute("value", "");

    fragment.captionTimer = setTimeout(function () {
        const typeNext = function () {
            /*
             * Do NOT check fragment.found here.
             * The visitor may temporarily lose the image target while reading;
             * the sentence must keep typing until it is complete.
             */
            if (!activeWork || activeFragment !== fragment) {
                fragment.captionTimer = null;
                return;
            }

            index++;

            /*
             * The first character and the black panel appear together.
             * After this, the panel stays visible while the sentence types.
             */
            if (index === 1) {
                fragment.caption.setAttribute("visible", "true");
                if (fragment.captionPanel) {
                    fragment.captionPanel.setAttribute("visible", "true");
                }
            }

            fragment.captionText.setAttribute("value", fullText.slice(0, index));

            if (index < fullText.length) {
                fragment.captionTimer = setTimeout(typeNext, 28);
            } else {
                fragment.captionTimer = null;
                fragment.captionTypingComplete = true;
            }
        };

        typeNext();
    }, delayMs || 500);
}

/* ================================================= */
/* STUDENT WORK */
/* ================================================= */
function createStudentWork(fragment, workIndex) {
    const work = document.createElement("a-entity");
    work.id = "fragment" + (fragment.index + 1) + "-work" + (workIndex + 1);
    work.setAttribute("position", "0 0 0.35");
    work.setAttribute("visible", "false");

    /*
     * Every fragment now gets its real GLB container.
     * The GLB itself is NOT downloaded here.
     * It is downloaded lazily when this fragment's puzzle starts.
     */
    const model = document.createElement("a-entity");
    model.setAttribute("position", "0 0 0");
    model.setAttribute("scale", "0.025 0.025 0.025");
    model.setAttribute("visible", "false");
    model.setAttribute("class", "student-work-model");

    studentWorkStates[fragment.index].model = model;
    work.appendChild(model);

    fragment.target.appendChild(work);
    fragment.works.push(work);
    return work;
}
/* ================================================= */
/* HOTSPOT — ONE PER FRAGMENT */
/* ================================================= */
function createHotspot(fragment, workIndex) {
    const hotspot = document.createElement("a-entity");
    hotspot.id = "fragment" + (fragment.index + 1) + "-hotspot" + (workIndex + 1);
    hotspot.classList.add("hotspot");
    hotspot.setAttribute("visible", "false");

    const palette = fragmentGlowPalettes[fragment.index] || ["#FFD400"];
    const chosenColor = palette[Math.floor(Math.random() * palette.length)];
    fragment.glowColor = chosenColor;

    /* ================================================= */
    /* HOTSPOT — USER-PROVIDED PNG FILES ONLY */
    /* ================================================= */
    /*
     * Use the six hotspot PNG files already placed in the AR testing folder.
     * Their transparent background and exact artwork silhouette are preserved.
     * Position and size are unchanged; ONLY opacity is animated below.
     */
    const hotspotFiles = [
        "./mural fragment 1 hotspot.png",
        "./mural fragment 2 hotspot.png",
        "./mural fragment 3 hotspot.png",
        "./mural fragment 4 hotspot.png",
        "./mural fragment 5 hotspot.png",
        "./mural fragment 6 hotspot.png"
    ];

    const hotspotSrc = hotspotFiles[fragment.index];

    /* Direct overlay — do not change this position. */
    hotspot.setAttribute("position", "0 0 0.001");
    hotspot.setAttribute("scale", "1 1 1");

    const hotspotImage = document.createElement("a-image");
    hotspotImage.setAttribute("src", hotspotSrc);
    hotspotImage.setAttribute("width", "1");
    hotspotImage.setAttribute("height", "0.599609375");
    hotspotImage.setAttribute("position", "0 0 0");
    hotspotImage.setAttribute(
        "material",
        "transparent: true; alphaTest: 0.01; side: double; depthWrite: false; opacity: 0.72;"
    );
    hotspot.appendChild(hotspotImage);

    /* Exact same PNG for a very soft glow. */
    const hotspotGlow = document.createElement("a-image");
    hotspotGlow.setAttribute("src", hotspotSrc);
    hotspotGlow.setAttribute("width", "1.006");
    hotspotGlow.setAttribute("height", "0.6036");
    hotspotGlow.setAttribute("position", "0 0 0.0005");
    hotspotGlow.setAttribute(
        "material",
        "transparent: true; alphaTest: 0.01; side: double; depthWrite: false; opacity: 0.16; blending: additive;"
    );
    hotspot.appendChild(hotspotGlow);

    /* ================================================= */
    /* HOTSPOT FLASH EFFECT — OPACITY ONLY */
    /* ================================================= */
    /*
     * Do NOT animate position, scale, size or shape.
     * Direct THREE.js material opacity is used because it is more reliable
     * on mobile than A-Frame material.opacity animation for a-image.
     */
    const pulseStart = performance.now() + Math.random() * 500;
    const pulseDuration = 1050;

    function getMaterial(mesh) {
        if (!mesh || !mesh.material) return null;
        return Array.isArray(mesh.material) ? mesh.material[0] : mesh.material;
    }

    function pulseHotspot(now) {
        const maskMesh = hotspotImage.getObject3D("mesh");
        const glowMesh = hotspotGlow.getObject3D("mesh");
        const maskMaterial = getMaterial(maskMesh);
        const glowMaterial = getMaterial(glowMesh);

        if (maskMaterial) {
            const elapsed = (now - pulseStart) % pulseDuration;
            const phase = elapsed / pulseDuration;

            /* Smooth bright/dim cycle — noticeable but not distracting. */
            const wave = (Math.sin(phase * Math.PI * 2 - Math.PI / 2) + 1) / 2;
            const eased = wave * wave * (3 - 2 * wave);

            maskMaterial.opacity = 0.32 + eased * 0.48;

            if (glowMaterial) {
                glowMaterial.opacity = 0.05 + eased * 0.30;
            }
        }

        requestAnimationFrame(pulseHotspot);
    }

    requestAnimationFrame(pulseHotspot);

    fragment.target.appendChild(hotspot);
    fragment.hotspots.push(hotspot);
    return hotspot;
}

fragments.forEach(function (fragment) {
    createFragmentCaption(fragment);
    createHotspot(fragment, 0);
    createStudentWork(fragment, 0);
});

/* ================================================= */
/* PUZZLE ENGINE */
/* ================================================= */
let puzzleState = null;

function shuffle(array) {
    const result = array.slice();
    for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
    }
    return result;
}

function showPuzzle(fragment) {
    if (!fragment) return;

    hideFragmentClue();
    hideFragmentHotspots(fragment);
    hideFragmentCaption(fragment);

    fragment.puzzleStarted = true;
    puzzleState = {
        fragmentIndex: fragment.index,
        solvedCount: 0,
        pieces: [],
        activePiece: null,
        offsetX: 0,
        offsetY: 0,
        startLeft: 0,
        startTop: 0,
        startParent: null
    };

    /*
     * Begin loading ONLY this fragment's Student Work while the visitor
     * solves the puzzle. The puzzle itself does not wait for the GLB.
     */
    prepareStudentWorkForPuzzle(fragment);

    puzzleBoard.innerHTML = "";

    // Remove any old floating pieces from a previous puzzle.
    puzzleOverlay.querySelectorAll(".puzzle-piece").forEach(function (piece) {
        piece.remove();
    });

    puzzleProgress.innerText = "0/" + PUZZLE_PIECES + " pieces placed";
    puzzleComplete.classList.remove("show");
    puzzleComplete.style.display = "none";

    const imageUrl = fragmentClueImages[fragment.index][0];
    const order = shuffle([...Array(PUZZLE_PIECES).keys()]);

    const tileW = 100 / PUZZLE_COLS;
    const tileH = 100 / PUZZLE_ROWS;

    // The six empty target slots stay inside the board.
    for (let i = 0; i < PUZZLE_PIECES; i++) {
        const slot = document.createElement("div");
        slot.className = "puzzle-slot";
        slot.style.left = (i % PUZZLE_COLS) * tileW + "%";
        slot.style.top = Math.floor(i / PUZZLE_COLS) * tileH + "%";
        slot.style.width = tileW + "%";
        slot.style.height = tileH + "%";
        puzzleBoard.appendChild(slot);
    }

    // Show the overlay first so the board has its real screen position.
    puzzleOverlay.style.display = "flex";
    puzzleReload.style.display = "flex";
    instruction.style.display = "none";
    nextButton.style.display = "none";

    requestAnimationFrame(function () {
        const overlayRect = puzzleOverlay.getBoundingClientRect();
        const boardRect = puzzleBoard.getBoundingClientRect();

        /*
         * Pieces are deliberately NOT placed in the board.
         * They are scattered around it, like fragments floating nearby,
         * waiting for the visitor to collect them.
         */
        const pieceW = boardRect.width / PUZZLE_COLS;
        const pieceH = boardRect.height / PUZZLE_ROWS;

        const safeTop = Math.max(
            12,
            boardRect.top - overlayRect.top - pieceH - 28
        );
        const safeBottom = Math.min(
            overlayRect.height - pieceH - 12,
            boardRect.bottom - overlayRect.top + 28
        );

        const leftZoneX = Math.max(
            8,
            boardRect.left - overlayRect.left - pieceW - 32
        );
        const rightZoneX = Math.min(
            overlayRect.width - pieceW - 8,
            boardRect.right - overlayRect.left + 32
        );

        const positions = [];

        /*
         * IMPORTANT FIX: never allow loose pieces to sit on top of one another.
         * On a narrow phone screen the old left/right zones could collapse into
         * the same area, causing one fragment to become impossible to grab.
         *
         * We therefore calculate six guaranteed-visible slots first. They are
         * still slightly irregular, but each piece gets its own protected area.
         */
        const availableH = Math.max(1, safeBottom - safeTop);
        const sideGap = Math.max(8, Math.min(18, pieceW * 0.10));
        const verticalGap = Math.max(8, Math.min(18, pieceH * 0.10));

        const minX = 6;
        const maxX = Math.max(minX, overlayRect.width - pieceW - 6);
        const minY = 6;
        const maxY = Math.max(minY, overlayRect.height - pieceH - 6);

        /*
         * First preference: three left + three right positions outside the
         * board. If the phone is too narrow for that, fall back to six evenly
         * separated positions around the screen. In both cases, no two pieces
         * share the same starting rectangle.
         */
        const leftX = Math.max(minX, Math.min(maxX, leftZoneX));
        const rightX = Math.max(minX, Math.min(maxX, rightZoneX));

        const bandY = [
            Math.max(minY, Math.min(maxY, safeTop + availableH * 0.14)),
            Math.max(minY, Math.min(maxY, safeTop + availableH * 0.50)),
            Math.max(minY, Math.min(maxY, safeTop + availableH * 0.86))
        ];

        const candidates = [
            { x: leftX,  y: bandY[0] },
            { x: leftX,  y: bandY[1] },
            { x: leftX,  y: bandY[2] },
            { x: rightX, y: bandY[0] },
            { x: rightX, y: bandY[1] },
            { x: rightX, y: bandY[2] }
        ];

        /*
         * Resolve collisions mathematically before the pieces are created.
         * A candidate is moved vertically until it no longer intersects a
         * previous candidate; if there is not enough vertical room, we spread
         * the six pieces evenly across the full overlay as a final fallback.
         */
        function overlaps(a, b) {
            return !((a.x + pieceW + sideGap <= b.x) ||
                     (b.x + pieceW + sideGap <= a.x) ||
                     (a.y + pieceH + verticalGap <= b.y) ||
                     (b.y + pieceH + verticalGap <= a.y));
        }

        const safePositions = [];
        candidates.forEach(function (candidate) {
            let pos = {
                x: Math.max(minX, Math.min(maxX, candidate.x)),
                y: Math.max(minY, Math.min(maxY, candidate.y))
            };

            let attempts = 0;
            while (safePositions.some(function (existing) { return overlaps(pos, existing); }) && attempts < 24) {
                pos.y += Math.max(10, pieceH * 0.18);
                if (pos.y > maxY) {
                    pos.y = minY + ((attempts + 1) * Math.max(8, pieceH * 0.12)) % Math.max(1, maxY - minY + 1);
                }
                attempts++;
            }

            safePositions.push(pos);
        });

        /*
         * If the viewport is physically too narrow for six non-overlapping
         * pieces in side bands, use six screen-wide lanes. This keeps every
         * piece accessible; the visitor can still drag each piece to the board.
         */
        if (safePositions.some(function (pos, index) {
            return safePositions.slice(0, index).some(function (other) { return overlaps(pos, other); });
        })) {
            safePositions.length = 0;
            const totalH = Math.max(1, overlayRect.height - pieceH - 12);
            for (let i = 0; i < PUZZLE_PIECES; i++) {
                safePositions.push({
                    x: Math.max(minX, Math.min(maxX, i % 2 === 0 ? minX : maxX)),
                    y: Math.max(minY, Math.min(maxY, minY + (totalH * i / Math.max(1, PUZZLE_PIECES - 1))))
                });
            }
        }

        safePositions.forEach(function (pos) {
            positions.push(pos);
        });

        order.forEach(function (correctIndex, shuffledIndex) {
            const piece = document.createElement("div");
            piece.className = "puzzle-piece";
            piece.dataset.correct = String(correctIndex);
            piece.dataset.locked = "false";

            piece.style.width = pieceW + "px";
            piece.style.height = pieceH + "px";
            piece.style.backgroundImage = "url('" + imageUrl + "')";
            piece.style.backgroundSize =
                PUZZLE_COLS * 100 + "% " + PUZZLE_ROWS * 100 + "%";
            piece.style.backgroundPosition =
                (correctIndex % PUZZLE_COLS) * 50 + "% " +
                Math.floor(correctIndex / PUZZLE_COLS) * 100 + "%";

            const pos = positions[shuffledIndex];
            piece.style.left = pos.x + "px";
            piece.style.top = pos.y + "px";

            const rotation = (Math.random() - 0.5) * 14;
            const duration = (2.6 + Math.random() * 1.8).toFixed(2) + "s";
            const floatDistance = (5 + Math.random() * 7).toFixed(1) + "px";

            piece.style.setProperty("--piece-rotation", rotation + "deg");
            piece.style.setProperty("--float-duration", duration);
            piece.style.setProperty("--float-distance", floatDistance);
            piece.style.zIndex = String(20 + shuffledIndex);

            piece.addEventListener("pointerdown", puzzlePointerDown);
            piece.addEventListener("pointermove", puzzlePointerMove);
            piece.addEventListener("pointerup", puzzlePointerUp);
            piece.addEventListener("pointercancel", puzzlePointerUp);

            puzzleOverlay.appendChild(piece);
            puzzleState.pieces.push(piece);
        });
    });
}

/* ================================================= */
/* PUZZLE RELOAD — CURRENT PUZZLE ONLY */
/* ================================================= */
puzzleReload.addEventListener("click", function (event) {
    event.preventDefault();
    event.stopPropagation();

    if (!puzzleState) return;

    const fragment = fragments[puzzleState.fragmentIndex];
    if (!fragment || fragment.puzzleSolved) return;

    /*
     * This intentionally calls showPuzzle() for the CURRENT fragment only.
     * It does NOT reload the webpage, camera, QR code, completed fragments,
     * target database, or the visitor's overall progress.
     */
    puzzleReload.style.transform = "scale(0.92) rotate(-25deg)";
    setTimeout(function () {
        puzzleReload.style.transform = "";
    }, 160);

    showPuzzle(fragment);
});

function puzzlePointerDown(event) {
    if (!puzzleState) return;
    if (this.dataset.locked === "true") return;

    event.preventDefault();
    this.setPointerCapture?.(event.pointerId);

    // Stop the floating animation while the visitor is holding the piece.
    this.style.animation = "none";
    this.classList.add("dragging");
    puzzleState.activePiece = this;

    const overlayRect = puzzleOverlay.getBoundingClientRect();
    const left = parseFloat(this.style.left) || 0;
    const top = parseFloat(this.style.top) || 0;

    puzzleState.startLeft = left;
    puzzleState.startTop = top;
    puzzleState.startParent = this.parentElement;

    puzzleState.offsetX =
        event.clientX - overlayRect.left - left;
    puzzleState.offsetY =
        event.clientY - overlayRect.top - top;

    this.style.zIndex = "100";
}

function puzzlePointerMove(event) {
    if (!puzzleState || puzzleState.activePiece !== this) return;
    if (this.dataset.locked === "true") return;

    event.preventDefault();

    const overlayRect = puzzleOverlay.getBoundingClientRect();
    const boardRect = puzzleBoard.getBoundingClientRect();

    const w = parseFloat(this.style.width);
    const h = parseFloat(this.style.height);

    let x =
        event.clientX -
        overlayRect.left -
        puzzleState.offsetX;

    let y =
        event.clientY -
        overlayRect.top -
        puzzleState.offsetY;

    // Allow free movement over the board and around it,
    // while keeping the whole piece visible on screen.
    x = Math.max(4, Math.min(overlayRect.width - w - 4, x));
    y = Math.max(4, Math.min(overlayRect.height - h - 4, y));

    this.style.left = x + "px";
    this.style.top = y + "px";
}

function puzzlePointerUp(event) {
    if (!puzzleState || puzzleState.activePiece !== this) return;

    event.preventDefault();
    this.classList.remove("dragging");

    const overlayRect = puzzleOverlay.getBoundingClientRect();
    const boardRect = puzzleBoard.getBoundingClientRect();

    const w = parseFloat(this.style.width);
    const h = parseFloat(this.style.height);

    const currentLeft = parseFloat(this.style.left) || 0;
    const currentTop = parseFloat(this.style.top) || 0;

    // Convert the board's screen position into puzzleOverlay coordinates.
    const boardLeft = boardRect.left - overlayRect.left;
    const boardTop = boardRect.top - overlayRect.top;

    const tileW = boardRect.width / PUZZLE_COLS;
    const tileH = boardRect.height / PUZZLE_ROWS;

    const correctIndex = Number(this.dataset.correct);
    const targetLeft =
        boardLeft + (correctIndex % PUZZLE_COLS) * tileW;
    const targetTop =
        boardTop + Math.floor(correctIndex / PUZZLE_COLS) * tileH;

    const tolerance = Math.min(tileW, tileH) * 0.30;

    const distance = Math.hypot(
        currentLeft - targetLeft,
        currentTop - targetTop
    );

    if (distance <= tolerance) {
        /*
         * Look for another movable piece occupying the target.
         * Locked pieces are never overwritten.
         */
        let occupant = null;
        let bestOverlap = 0;

        for (const other of puzzleState.pieces) {
            if (other === this) continue;

            const otherLeft = parseFloat(other.style.left) || 0;
            const otherTop = parseFloat(other.style.top) || 0;
            const otherRight = otherLeft + w;
            const otherBottom = otherTop + h;

            const overlapW = Math.max(
                0,
                Math.min(otherRight, targetLeft + tileW) -
                Math.max(otherLeft, targetLeft)
            );

            const overlapH = Math.max(
                0,
                Math.min(otherBottom, targetTop + tileH) -
                Math.max(otherTop, targetTop)
            );

            const overlapArea = overlapW * overlapH;

            if (overlapArea > bestOverlap) {
                bestOverlap = overlapArea;
                occupant = other;
            }
        }

        const targetArea = tileW * tileH;
        const targetOccupied =
            occupant && bestOverlap > targetArea * 0.20;

        if (targetOccupied && occupant.dataset.locked === "true") {
            // Never cover a correctly locked piece.
            this.style.left = puzzleState.startLeft + "px";
            this.style.top = puzzleState.startTop + "px";
        } else {
            if (targetOccupied) {
                const occupantLeft = parseFloat(occupant.style.left) || 0;
                const occupantTop = parseFloat(occupant.style.top) || 0;

                // Move the displaced piece to the dragged piece's old spot.
                occupant.style.left = puzzleState.startLeft + "px";
                occupant.style.top = puzzleState.startTop + "px";
                occupant.style.zIndex = "20";

                // If another movable piece is sitting on that old spot,
                // move it to the displaced piece's previous spot.
                for (const other of puzzleState.pieces) {
                    if (other === this || other === occupant) continue;

                    const otherLeft = parseFloat(other.style.left) || 0;
                    const otherTop = parseFloat(other.style.top) || 0;

                    const overlapsOld =
                        Math.abs(otherLeft - puzzleState.startLeft) < tileW * 0.35 &&
                        Math.abs(otherTop - puzzleState.startTop) < tileH * 0.35;

                    if (overlapsOld && other.dataset.locked !== "true") {
                        other.style.left = occupantLeft + "px";
                        other.style.top = occupantTop + "px";
                        other.style.zIndex = "20";
                        break;
                    }
                }
            }

            // Snap the correct piece exactly into the target slot.
            this.style.left = targetLeft + "px";
            this.style.top = targetTop + "px";
            this.dataset.locked = "true";
            this.classList.add("locked");
            this.style.animation = "none";
            this.style.transform = "rotate(0deg)";
            this.style.zIndex = "80";

            puzzleState.solvedCount++;
            puzzleProgress.innerText =
                puzzleState.solvedCount +
                "/" +
                PUZZLE_PIECES +
                " pieces placed";

            if (puzzleState.solvedCount === PUZZLE_PIECES) {
                finishPuzzle();
            }
        }
    }

    /*
     * If it was not correct, leave it where the visitor released it,
     * and restart its gentle floating animation.
     */
    if (this.dataset.locked !== "true") {
        const rotation = this.style.getPropertyValue("--piece-rotation") || "0deg";
        this.style.animation =
            "puzzlePieceFloat var(--float-duration, 3.2s) ease-in-out infinite";
        this.style.setProperty("--piece-rotation", rotation);
        this.style.zIndex = "20";
    }

    puzzleState.activePiece = null;
}

function finishPuzzle() {
    const fragment = fragments[puzzleState.fragmentIndex];
    fragment.puzzleSolved = true;

    puzzleComplete.style.display = "block";
    requestAnimationFrame(function () {
        puzzleComplete.classList.add("show");
    });

    setTimeout(function () {
        puzzleComplete.classList.remove("show");
        setTimeout(function () {
            puzzleComplete.style.display = "none";
            puzzleOverlay.style.display = "none";
            puzzleReload.style.display = "none";
            showFragmentHotspots(fragment);
        }, 220);
    }, 700);
}

/* ================================================= */
/* HOTSPOTS */
/* ================================================= */
function showFragmentHotspots(fragment) {
    if (!fragment || !fragment.puzzleSolved || activeWork) return;

    hideFragmentCaption(fragment);

    /* The visitor may solve the puzzle away from the mural target.
       The story hotspot is only released after the phone is returned to it. */
    if (!fragment.found) {
        hideFragmentHotspots(fragment);
        instruction.innerText = "Puzzle complete — place your phone back over the mural fragment";
        instruction.style.display = "block";
        return;
    }

    fragment.hotspots.forEach(function (hotspot, index) {
        const work = fragment.works[index];
        if (work && work.dataset.completed !== "true") {
            hotspot.setAttribute("visible", "true");
        }
    });

    instruction.innerText = "Tap the glowing colour block to explore the student work";
    instruction.style.display = "block";
}

function hideFragmentHotspots(fragment) {
    if (!fragment) return;
    fragment.hotspots.forEach(function (hotspot) {
        hotspot.setAttribute("visible", "false");
    });
}

/* ================================================= */
/* TARGET FOUND / LOST */
/* ================================================= */
fragments.forEach(function (fragment) {
    fragment.target.addEventListener("targetFound", function () {
        fragment.found = true;

        if (!isExpectedFragment(fragment)) {
            instruction.innerText = "Not this fragment — find Fragment " + (completedFragments + 1);
            instruction.style.display = "block";
            return;
        }

        activeFragment = fragment;
        hideFragmentClue();

        /* If Student Work is already open, a re-acquired target should
           simply restore the story layer instead of restarting anything. */
        if (activeWork) {
            if (activeFragment === fragment) {
                activeWork.setAttribute("visible", "true");
                typeFragmentCaption(fragment, 0);
            }
            return;
        }

        if (fragment.puzzleSolved) {
            showFragmentHotspots(fragment);
        } else if (fragment.puzzleStarted) {
            /*
             * The puzzle has already been scanned/opened once.
             * NEVER call showPuzzle() again here, because that would shuffle
             * the six pieces and destroy the visitor's current progress.
             */
            puzzleOverlay.style.display = "flex";
            puzzleReload.style.display = "flex";
            instruction.style.display = "none";
        } else {
            showPuzzle(fragment);
        }
    });

    fragment.target.addEventListener("targetLost", function () {
        fragment.found = false;

        /*
         * Once Student Work is open, its caption belongs to the active
         * exploration state. Do not let a brief AR targetLost event remove
         * the text that has just appeared.
         */
        if (!(activeWork && activeFragment === fragment)) {
            hideFragmentCaption(fragment);
        }

        hideFragmentHotspots(fragment);
        isDragging = false;

        /* IMPORTANT: once the puzzle has opened, it stays on screen even
           if the visitor moves the phone away from the target. This lets
           them solve the puzzle comfortably with the phone in their hands. */
        if (!activeWork && fragment.index === completedFragments && !fragment.puzzleSolved) {
            hideFragmentClue();
            puzzleOverlay.style.display = "flex";
            puzzleReload.style.display = "flex";
            instruction.style.display = "none";
        }

        if (!activeWork && fragment.puzzleSolved && fragment.index === completedFragments) {
            instruction.innerText = "Puzzle complete — place your phone back over the mural fragment";
            instruction.style.display = "block";
        }
    });
});

/* ================================================= */
/* RAYCASTER */
/* ================================================= */
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

function getThreeCamera() {
    if (scene.camera && scene.camera.isCamera) return scene.camera;
    if (camera.components && camera.components.camera && camera.components.camera.camera) {
        return camera.components.camera.camera;
    }
    return null;
}

function checkHotspotClick(clientX, clientY) {
    if (activeWork || !activeFragment || !activeFragment.found || !activeFragment.puzzleSolved) return false;

    const canvas = scene.canvas;
    if (!canvas) return false;
    const rect = canvas.getBoundingClientRect();

    mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;

    const threeCamera = getThreeCamera();
    if (!threeCamera) return false;

    raycaster.setFromCamera(mouse, threeCamera);

    for (let i = 0; i < activeFragment.hotspots.length; i++) {
        const hotspot = activeFragment.hotspots[i];
        if (!hotspot.object3D.visible) continue;

        const intersections = raycaster.intersectObject(hotspot.object3D, true);
        if (intersections.length > 0) {
            openStudentWork(activeFragment.index, i);
            return true;
        }
    }
    return false;
}

/* ================================================= */
/* GLB LOADING — LAZY, ONE FRAGMENT AT A TIME */
/* ================================================= */

/*
 * The old version started Student Work 1 immediately when the AR page opened.
 * That meant the phone could begin downloading/parsing a large GLB before the
 * visitor even reached the puzzle, and it only supported one GLB.
 *
 * This version:
 *   1. creates all six model containers immediately (very light);
 *   2. downloads ONLY the current fragment's GLB when its puzzle starts;
 *   3. keeps the current GLB in memory until NEXT;
 *   4. releases that GLB after NEXT so memory does not accumulate across all 6.
 *
 * Required files in the SAME folder as index.html:
 *   student-work-01.glb
 *   student-work-02.glb
 *   student-work-03.glb
 *   student-work-04.glb
 *   student-work-05.glb
 *   student-work-06.glb
 */

function startStudentWorkLoad(fragmentIndex) {
    const state = studentWorkStates[fragmentIndex];
    if (!state) return Promise.reject(new Error("Invalid Student Work index."));

    if (state.ready) return Promise.resolve(state.model);
    if (state.loadPromise) return state.loadPromise;

    state.loadPromise = loadStudentWorkWithRetry(fragmentIndex)
        .finally(function () {
            state.loadPromise = null;
        });

    return state.loadPromise;
}

async function loadStudentWorkWithRetry(fragmentIndex) {
    const state = studentWorkStates[fragmentIndex];
    const model = state && state.model;
    const baseURL = STUDENT_WORK_URLS[fragmentIndex];

    if (!state || !model || !baseURL) {
        throw new Error("Student Work " + (fragmentIndex + 1) + " is not configured.");
    }

    for (let attempt = 1; attempt <= STUDENT_WORK_MAX_ATTEMPTS; attempt++) {
        try {
            const url = attempt === 1
                ? baseURL
                : baseURL + "?retry=" + attempt + "-" + Date.now();

            const response = await fetch(url, {
                method: "GET",
                cache: attempt === 1 ? "default" : "reload",
                credentials: "same-origin"
            });

            if (!response.ok) {
                throw new Error("HTTP " + response.status);
            }

            const buffer = await response.arrayBuffer();

            if (!buffer || buffer.byteLength < 20) {
                throw new Error("GLB response is empty or too small.");
            }

            if (state.blobURL) {
                URL.revokeObjectURL(state.blobURL);
                state.blobURL = null;
            }

            const blob = new Blob([buffer], {
                type: "model/gltf-binary"
            });

            state.blobURL = URL.createObjectURL(blob);

            /* Clear any previous A-Frame model before attaching a new attempt. */
            model.removeAttribute("gltf-model");

            await new Promise(function (resolve, reject) {
                let settled = false;

                function cleanup() {
                    model.removeEventListener("model-loaded", onLoaded);
                    model.removeEventListener("model-error", onError);
                }

                function onLoaded() {
                    if (settled) return;
                    settled = true;
                    cleanup();
                    resolve();
                }

                function onError(event) {
                    if (settled) return;
                    settled = true;
                    cleanup();
                    reject(event || new Error("A-Frame GLB parse failed."));
                }

                model.addEventListener("model-loaded", onLoaded);
                model.addEventListener("model-error", onError);

                model.setAttribute("gltf-model", state.blobURL);

                /* In case A-Frame has already created the mesh synchronously. */
                if (model.getObject3D("mesh")) {
                    onLoaded();
                }
            });

            state.ready = true;
            state.failed = false;
            hideModelLoading();

            return model;

        } catch (error) {
            console.warn(
                "Student Work " + (fragmentIndex + 1) +
                " GLB attempt " + attempt + " failed",
                error
            );

            state.ready = false;

            if (attempt < STUDENT_WORK_MAX_ATTEMPTS) {
                await new Promise(function (resolve) {
                    setTimeout(resolve, 500);
                });
            }
        }
    }

    state.failed = true;
    throw new Error(
        "Student Work " + (fragmentIndex + 1) +
        " could not be loaded."
    );
}

function showModelLoading(fragmentIndex) {
    modelLoading.classList.remove("error");
    modelLoading.innerText =
        "Loading Student Work " + (fragmentIndex + 1) + "…";
    modelLoading.style.display = "block";
}

function hideModelLoading() {
    modelLoading.style.display = "none";
}

/*
 * Start loading the CURRENT Student Work while the visitor solves the puzzle.
 * This function is intentionally silent: no loading overlay is shown during
 * the puzzle, so the puzzle experience is not blocked by the GLB.
 */
function prepareStudentWorkForPuzzle(fragment) {
    if (!fragment) return;

    const state = studentWorkStates[fragment.index];
    if (!state || state.ready || state.loadPromise) return;

    startStudentWorkLoad(fragment.index).catch(function (error) {
        console.warn(
            "Student Work " + (fragment.index + 1) +
            " background load failed:",
            error
        );
    });
}

/*
 * Release the current GLB after the visitor presses NEXT.
 * This keeps the phone from holding all six large models at once.
 */
function releaseStudentWork(fragmentIndex) {
    const state = studentWorkStates[fragmentIndex];
    if (!state || !state.model) return;

    const model = state.model;

    try {
        const object = model.getObject3D("mesh");

        if (object) {
            object.traverse(function (node) {
                if (!node.isMesh) return;

                if (node.geometry && node.geometry.dispose) {
                    node.geometry.dispose();
                }

                if (node.material) {
                    const materials = Array.isArray(node.material)
                        ? node.material
                        : [node.material];

                    materials.forEach(function (material) {
                        if (!material) return;

                        if (material.map && material.map.dispose) material.map.dispose();
                        if (material.normalMap && material.normalMap.dispose) material.normalMap.dispose();
                        if (material.roughnessMap && material.roughnessMap.dispose) material.roughnessMap.dispose();
                        if (material.metalnessMap && material.metalnessMap.dispose) material.metalnessMap.dispose();
                        if (material.emissiveMap && material.emissiveMap.dispose) material.emissiveMap.dispose();

                        if (material.dispose) material.dispose();
                    });
                }
            });
        }
    } catch (error) {
        console.warn("Student Work " + (fragmentIndex + 1) + " cleanup warning:", error);
    }

    model.removeAttribute("gltf-model");
    model.setAttribute("visible", "false");

    if (state.blobURL) {
        URL.revokeObjectURL(state.blobURL);
        state.blobURL = null;
    }

    state.ready = false;
    state.failed = false;
}

/* ================================================= */
/* STUDENT WORK REVEAL — SCALE + DELAYED TYPEWRITER */
/* ================================================= */
function animateStudentWorkReveal(work, fragment) {
    if (!work) return;

    const object = work.object3D;
    if (!object) return;

    /* Start almost invisible/small, then grow smoothly into place. */
    object.scale.set(0.001, 0.001, 0.001);
    const start = performance.now();
    const duration = 650;

    function frame(now) {
        if (!activeWork || activeWork !== work || activeFragment !== fragment) return;

        const t = Math.min(1, (now - start) / duration);
        const eased = 1 - Math.pow(1 - t, 3);
        const scale = 0.001 + 0.999 * eased;
        object.scale.set(scale, scale, scale);

        if (t < 1) {
            requestAnimationFrame(frame);
        } else {
            object.scale.set(1, 1, 1);
        }
    }

    requestAnimationFrame(frame);

    /* The Student Work grows for 650ms first; then wait another 0.5s
       before starting the typewriter caption. */
    typeFragmentCaption(fragment, 1150);
}

/* ================================================= */
/* OPEN STUDENT WORK */
/* ================================================= */
function openStudentWork(fragmentIndex, workIndex) {
    if (activeWork) return;

    const fragment = fragments[fragmentIndex];
    const work = fragment && fragment.works[workIndex];

    if (!fragment || !work || work.dataset.completed === "true") return;
    if (!fragment.found) return;

    activeFragment = fragment;
    activeWork = work;
    activeWorkIndex = workIndex;

    hideFragmentHotspots(fragment);
    hideFragmentCaption(fragment, true);
    instruction.style.display = "none";

    /* Reset the Student Work to a tiny starting scale before revealing it. */
    work.object3D.scale.set(0.001, 0.001, 0.001);
    work.setAttribute("visible", "true");
    work.object3D.rotation.set(0, 0, 0);

    const state = studentWorkStates[fragment.index];

    /*
     * Usually the GLB has already finished loading during the puzzle.
     * If not, show a loading message ONLY now, after the visitor tapped
     * the hotspot. The AR/puzzle flow itself is never blocked by loading.
     */
    if (!state || !state.ready) {
        showModelLoading(fragment.index);

        startStudentWorkLoad(fragment.index).then(function () {
            if (!activeWork || activeWork !== work) return;

            if (state && state.model) {
                state.model.setAttribute("visible", "true");
            }

            animateStudentWorkReveal(work, fragment);
            nextButton.style.display = "block";

        }).catch(function (error) {
            console.error(
                "Student Work " + (fragment.index + 1) +
                " failed to load:",
                error
            );

            modelLoading.classList.add("error");
            modelLoading.innerText =
                "Student Work " + (fragment.index + 1) +
                " could not load. Please tap NEXT and continue.";

            /*
             * IMPORTANT FALLBACK:
             * A failed GLB must NEVER trap the visitor on the current fragment.
             * The previous version changed the error message but forgot to
             * reveal the NEXT button in this catch branch.
             */
            nextButton.innerText = "NEXT →";
            nextButton.style.display = "block";
        });

        return;
    }

    if (state.model) {
        state.model.setAttribute("visible", "true");
    }

    animateStudentWorkReveal(work, fragment);
    nextButton.style.display = "block";
}

/* ================================================= */
/* NEXT */
/* ================================================= */
nextButton.addEventListener("click", function (event) {
    event.stopPropagation();
    if (!activeWork) return;
    finishCurrentStudentWork();
});

function finishCurrentStudentWork() {
    if (!activeWork || !activeFragment) return;

    const work = activeWork;
    const fragment = activeFragment;

    if (work.dataset.completed === "true") return;
    work.dataset.completed = "true";
    fragment.completedWorks++;

    work.setAttribute("visible", "false");
    work.object3D.scale.set(1, 1, 1);
    hideFragmentCaption(fragment, true);

    /* Release the completed GLB before moving to the next fragment. */
    releaseStudentWork(fragment.index);

    activeWork = null;
    activeWorkIndex = -1;
    nextButton.style.display = "none";
    hideModelLoading();

    completeFragment(fragment);
}

/* ================================================= */
/* ROTATION */
/* ================================================= */
window.addEventListener("mousedown", function (event) {
    if (checkHotspotClick(event.clientX, event.clientY)) return;
    if (!activeWork || !activeWork.object3D.visible) return;

    isDragging = true;
    previousX = event.clientX;
    previousY = event.clientY;
});

window.addEventListener("mousemove", function (event) {
    if (!isDragging || !activeWork) return;

    const deltaX = event.clientX - previousX;
    const deltaY = event.clientY - previousY;
    activeWork.object3D.rotation.y += deltaX * 0.01;
    activeWork.object3D.rotation.x += deltaY * 0.01;
    previousX = event.clientX;
    previousY = event.clientY;
});

window.addEventListener("mouseup", function () {
    isDragging = false;
});

window.addEventListener("touchstart", function (event) {
    if (event.target === nextButton || nextButton.contains(event.target)) return;
    if (!event.touches.length) return;

    const touch = event.touches[0];
    if (checkHotspotClick(touch.clientX, touch.clientY)) {
        event.preventDefault();
        return;
    }

    if (!activeWork || !activeWork.object3D.visible) return;

    isDragging = true;
    previousX = touch.clientX;
    previousY = touch.clientY;
}, { passive: false });

window.addEventListener("touchmove", function (event) {
    if (!isDragging || !activeWork || !event.touches.length) return;

    const touch = event.touches[0];
    const deltaX = touch.clientX - previousX;
    const deltaY = touch.clientY - previousY;
    activeWork.object3D.rotation.y += deltaX * 0.01;
    activeWork.object3D.rotation.x += deltaY * 0.01;
    previousX = touch.clientX;
    previousY = touch.clientY;
    event.preventDefault();
}, { passive: false });

window.addEventListener("touchend", function () {
    isDragging = false;
});

/* ================================================= */
/* COMPLETE FRAGMENT */
/* ================================================= */
function completeFragment(fragment) {
    hideFragmentHotspots(fragment);
    hideFragmentCaption(fragment);
    completedFragments++;
    progress.innerText = completedFragments + "/" + TOTAL_FRAGMENTS;

    if (completedFragments >= TOTAL_FRAGMENTS) {
        showFinalMural();
        return;
    }

    activeFragment = null;
    instruction.innerText = "Fragment " + (fragment.index + 1) + " complete — find the next mural fragment";
    instruction.style.display = "block";
    showFragmentClue(completedFragments);
}

/* ================================================= */
/* FINAL MURAL — ORIGINAL */
/* ================================================= */
function showFinalMural() {
    hideFragmentClue();
    instruction.style.display = "none";
    document.querySelector(".example-container").style.display = "block";

    const finalText = "Dreams are intangible, they cannot be seen or touched. Technology, a creation of humans has becomes an extensions of our senses, it captures memories, emotions, and moments of everyday that we often overlook. The times, each era remind us to pause, reflects and continue chasing our dreams without losing ourself.";

    /*
       FINAL TRANSITION ONLY.
       The six REAL mural.fragment.1–6 images themselves become the final mural.
       There is NO second mural.final.png reveal and NO second final page.

       Flow:
       1. Fragment 6 completes.
       2. All six fragment images enter from different directions.
       3. Each fragment moves directly to its FINAL MURAL position.
       4. The six fragments stop there and remain visible as the completed mural.
       5. The message starts typing immediately and continues independently.
       6. Only after the complete message has finished does COMPLETE — 6/6 appear.
    */
    finalScreen.style.display = "flex";
    finalScreen.style.background = "rgba(70,70,70,0.34)";

    /* Never show the separate final-mural image during this transition. */
    finalMural.style.opacity = "0";
    finalMural.style.display = "none";
    finalMural.style.transition = "none";

    finalAssembly.style.display = "flex";
    finalAssembly.style.opacity = "1";
    finalAssemblyTyping.style.opacity = "1";
    finalAssemblyTyping.innerText = "";
    finalAssemblyTitle.style.opacity = "0";

    finalScreen.querySelector("#finalTitle").style.opacity = "0";
    finalMessage.style.opacity = "0";

    /*
       FINAL POSITIONS
       The completed mural is a 2-column × 3-row arrangement:

             [ 6 ] [ 5 ]
             [ 3 ] [ 4 ]
             [ 2 ] [ 1 ]

       Each piece travels directly into its own final position and stays there.
       No temporary grid and no second mural image are shown.
    */
    const destinations = [
        { left: 50, top: 66.666667, scale: 1, rotate: 0 },  // fragment 1 — lower right
        { left:  0, top: 66.666667, scale: 1, rotate: 0 },  // fragment 2 — lower left
        { left:  0, top: 33.333333, scale: 1, rotate: 0 },  // fragment 3 — middle left
        { left: 50, top: 33.333333, scale: 1, rotate: 0 },  // fragment 4 — middle right
        { left: 50, top:  0,        scale: 1, rotate: 0 },  // fragment 5 — upper right
        { left:  0, top:  0,        scale: 1, rotate: 0 }   // fragment 6 — upper left
    ];

    const starts = [
        [ 1.20,  0.95,  12],
        [-1.20,  0.85, -12],
        [-1.15, -0.85, -14],
        [ 0.00,  1.10,  10],
        [ 1.15, -0.85,  14],
        [ 0.00, -1.10, -10]
    ];

    /*
       Match the assembly frame to the REAL transition-image ratio.
       This is the key fix for the stretched / squeezed mural problem.
       With 2 columns × 3 rows, if one piece is W:H, the whole mural is
       (2W):(3H). Because the frame uses that exact ratio, each image can
       fill its cell with ZERO gaps and ZERO distortion.
    */
    function syncFinalAssemblyAspectRatio() {
        const referencePiece = finalAssemblyPieces.find(function (piece) {
            return piece.naturalWidth > 0 && piece.naturalHeight > 0;
        });

        if (!referencePiece) return false;

        finalAssemblyFrame.style.aspectRatio =
            (referencePiece.naturalWidth * 2) + " / " +
            (referencePiece.naturalHeight * 3);

        return true;
    }

    if (!syncFinalAssemblyAspectRatio()) {
        finalAssemblyPieces.forEach(function (piece) {
            piece.addEventListener("load", syncFinalAssemblyAspectRatio, { once: true });
        });
    }

    const frame = finalAssemblyFrame.getBoundingClientRect();

    finalAssemblyPieces.forEach(function (piece, i) {
        const start = starts[i];
        piece.style.opacity = "0";
        piece.style.left = destinations[i].left + "%";
        piece.style.top = destinations[i].top + "%";
        piece.style.transition = "none";
        piece.style.transform =
            "translate(" + (start[0] * frame.width * 0.72) + "px," +
            (start[1] * frame.height * 0.72) + "px) rotate(" + start[2] + "deg) scale(0.72)";
    });

    /*
       Bring each fragment directly into its final position.
       No intermediate arrangement is created.
    */
    finalAssemblyPieces.forEach(function (piece, i) {
        setTimeout(function () {
            const d = destinations[i];
            piece.style.transition =
                "transform 1250ms cubic-bezier(0.22,1,0.36,1), opacity 500ms ease";
            piece.style.opacity = "1";
            piece.style.transform =
                "translate(0,0) rotate(" + d.rotate + "deg) scale(" + d.scale + ")";
        }, 80 + i * 170);
    });

    /*
       Typing begins at the SAME time as the fragments start entering.
       It continues even after all six fragments have reached their positions.
    */
    let index = 0;
    function typeNext() {
        index++;
        finalAssemblyTyping.innerText = finalText.slice(0, index);

        if (index < finalText.length) {
            setTimeout(typeNext, 24);
        } else {
            /* COMPLETE appears only after every character has been typed. */
            setTimeout(function () {
                finalAssemblyTitle.style.transition = "opacity 700ms ease";
                finalAssemblyTitle.style.opacity = "1";
            }, 250);
        }
    }
    typeNext();
}


/* ================================================= */
/* INITIAL */
/* ================================================= */
instruction.innerText = "Scan a mural fragment to begin";
showFragmentClue(0);
progress.innerText = "0/6";

console.log("🚀 PAASWE AR SYSTEM READY — PUZZLE FLOW");
console.log("📦 6 FRAGMENTS");
console.log("🧩 6-PIECE PUZZLE PER FRAGMENT");
console.log("🧱 6 LAZY-LOADED STUDENT WORK GLBs");
console.log("➡️ NEXT BUTTON CONTROLS COMPLETION");
</script>
